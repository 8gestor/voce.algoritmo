<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trilha de Inglês</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/narracao.css">
    <link rel="stylesheet" href="assets/css/capitulos/ingles.css">
    <link rel="stylesheet" href="assets/css/capitulos/trilha.css">
    <link rel="stylesheet" href="assets/css/papel.css">
</head>
<body class="tr-mode">

    <main class="lab" id="lab">
        <span class="meta-tag" id="lb-meta"></span>

        <!-- O núcleo do leitor (ingles.js) exige esta estrutura; a Trilha usa só a voz, a tradução e o banco local dele. -->
        <section id="lb-library">
            <h1 id="lb-title"></h1>
            <p class="lb-intro" id="lb-intro"></p>
            <div class="lb-drop" id="lb-drop" tabindex="0" role="button" hidden><strong id="lb-drop-main"></strong><span id="lb-drop-sub"></span><input type="file" id="lb-file" hidden></div>
            <div class="lb-progress" id="lb-progress" hidden><div class="lb-progress-text" id="lb-progress-text"></div><div class="lb-bar"><div class="lb-bar-fill" id="lb-progress-fill"></div></div></div>
            <p class="lb-error" id="lb-error" role="alert" hidden></p>
            <h2 id="lb-h-docs"></h2>
            <div class="lb-tools" id="lb-tools" hidden><input type="search" id="lb-search" class="lb-input" autocomplete="off"><select id="lb-sort" class="lb-input"></select></div>
            <div class="lb-docs" id="lb-docs" aria-live="polite"></div>
            <p class="lb-note" id="lb-storage"></p>
            <h2 id="lb-h-engine"></h2>
            <div class="lb-engine" id="lb-engine" aria-live="polite"></div>
            <h2 id="lb-h-voice"></h2>
            <div class="lb-engine" id="lb-voice" aria-live="polite"></div>
            <p class="lb-note" id="lb-note"></p>
        </section>

        <section id="lb-reader" hidden>
            <div class="lb-toolbar">
                <button type="button" class="lb-btn" id="lb-back"></button>
                <div class="lb-study" id="lb-study" role="group"><span class="lb-study-label" id="lb-study-label"></span><button type="button" class="lb-btn" id="lb-translate-all"></button></div>
                <span class="lb-status" id="lb-status" aria-live="polite"></span>
            </div>
            <div class="lb-banner" id="lb-banner" role="alert" hidden><span id="lb-banner-text"></span><button type="button" class="lb-btn" id="lb-banner-btn" hidden></button></div>
            <h1 id="lb-doc-title"></h1>
            <p class="lb-doc-meta" id="lb-doc-meta"></p>
            <div class="lb-wrap" id="lb-wrap"><div class="lb-band" id="lb-band" aria-hidden="true"></div><article id="lb-text"></article></div>
        </section>
    </main>

    <script type="importmap">{"imports":{"onnxruntime-web":"./assets/vendor/piper/ort.min.js"}}</script>
    <script src="assets/js/ingles.js"></script>
    <script src="assets/js/ingles-nivel.js"></script>
    <script src="assets/js/ingles-voz.js"></script>
    <script>window.DD_TRILHA = true;</script>
    <script src="assets/js/trilha-conteudo.js"></script>
    <script src="assets/js/trilha-jogo.js"></script>
</body>
</html>
